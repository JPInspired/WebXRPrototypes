<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebXR Prototypes</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --bg: #f6f5f1; --ink: #15171c; --ink-2: #4a4f5c; --card: #fff; --line: rgba(21,23,28,.14); --brand: #2f4bd8; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1015; --ink: #eef0f5; --ink-2: #b7bdcc; --card: #171a23; --line: rgba(255,255,255,.14); --brand: #8ea2ff; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 44rem; margin: 0 auto; padding: 12vh 16px 4rem; }
    h1, h2 { font-family: Palatino, "Palatino Linotype", Georgia, serif; line-height: 1.2; margin: 0 0 .4rem; }
    p { color: var(--ink-2); margin: 0 0 1rem; }
    .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1.2rem 1.4rem; margin-top: 2rem; color: inherit; text-decoration: none; }
    .card:hover, .card:focus-visible { border-color: var(--brand); }
    .card b { color: var(--brand); }
  </style>
</head>
<body>
  <main>
    <h1>WebXR Prototypes</h1>
    <p>Lessons being tried out before they join the WebXR Library.</p>
    <a class="card" href="lessons/tourism-vr/"><h2>The Impact of Tourism</h2><p>Spanish, in virtual reality. Walk through a town and find out what tourism does to it.</p><b>Open Lesson</b></a>
  </main>
</body>
</html>
